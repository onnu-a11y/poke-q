function doFaintLogic(faintedSide,attackerSide){
  const idx=faintedSide==='my'?btl.myIdx:btl.enemyIdx;
  if(!btl.fainted[faintedSide].includes(idx))btl.fainted[faintedSide].push(idx);
  const remaining=(faintedSide==='my'?btl.myTeam:btl.enemyTeam).filter(function(_,i){return!btl.fainted[faintedSide].includes(i);});
  addBattleLog((faintedSide==='my'?btl.myTeam[btl.myIdx]:btl.enemyTeam[btl.enemyIdx]).name+'がたおれた！');
  btl.animating=false;
  if(remaining.length===0){
    // 全滅→勝敗
    const winSide=attackerSide;
    const winLabel=winSide==='my'?'🔴 チームレッドのかち！':'🔵 チームブルーのかち！';
    showWinLose(winLabel,winSide==='my'?'#922b21':'#1a5276');
  } else {
    // 次のポケモンを選ぶ
    if(faintedSide==='enemy'&&btl.cpuMode){
      // CPU自動交代（「選んでいる…」演出）
      doCpuChange(faintedSide);
    } else {
      showChangeSelect(faintedSide);
    }
  }
}

// ===== CPU行動 =====
function doCpuTurn(){
  if(btl.animating||btl.turn!=='enemy')return;
  const poke=btl.enemyTeam[btl.enemyIdx];
  const oppTypes=btl.myTeam[btl.myIdx].types||POKE_TYPES[btl.myTeam[btl.myIdx].id]||['ノーマル'];
  let best=null,bestScore=-1;
  poke.moves.forEach(function(mv){
    const c=calcCompatibility(mv.type,oppTypes);
    const score={super:3,normal:2,weak:1,zero:0}[c.cls];
    if(score>bestScore){bestScore=score;best={mv:mv,compat:c};}
  });
  if(best)playAttackSequence('enemy',best.mv,best.compat);
}

function doCpuChange(side){
  // 「CPUはつぎのポケモンを選んでいる…」演出（溜め）
  const ov=el('div','');
  ov.style.cssText='position:fixed;inset:0;z-index:7000;display:flex;align-items:center;justify-content:center;background:rgba(20,30,60,0.88);opacity:0;transition:opacity 0.25s;';
  const txt=el('div','');txt.style.cssText='font-size:20px;font-weight:900;color:white;text-align:center;letter-spacing:1px;';txt.textContent='🤖 CPUはつぎのポケモンをえらんでいる…';
  ov.appendChild(txt);document.body.appendChild(ov);
  requestAnimationFrame(function(){ov.style.opacity='1';});

  // 1.8秒の「選んでいる感」
  setTimeout(function(){
    ov.style.opacity='0';
    setTimeout(function(){
      ov.remove();
      // 次のポケモンを決定
      const team=btl.enemyTeam;
      const fainted=btl.fainted.enemy;
      const available=team.map(function(_,i){return i;}).filter(function(i){return i!==btl.enemyIdx&&!fainted.includes(i);});
      if(available.length===0)return;
      const nextIdx=available[Math.floor(Math.random()*available.length)];
      btl.enemyIdx=nextIdx;
      const newPoke=btl.enemyTeam[nextIdx];
      rollShiny(newPoke);
      // フェーズフラッシュ
      phaseFlash('linear-gradient(135deg,#1a5276,#2980b9)','🔵 '+newPoke.name+'、ゆけっ！','',function(){
        showBattleMain(false);
        setTimeout(function(){
          const eImg=document.querySelector('#btl-img-enemy img');
          if(eImg)playBallEmerge(eImg,'enemy',newPoke,function(){
            addBattleLog('CPU: '+newPoke.name+'、ゆけっ！');
            btl.turn='enemy';
            turnFlash('enemy',function(){
              updateTurnDisplay();
              setTimeout(doCpuTurn,700);
            });
          });
        },100);
      },1000);
    },280);
  },1800);
}

// ===== ターン表示更新 =====
function updateTurnDisplay(){
  const isMyTurn=btl.turn==='my';
  const turnBar=document.getElementById('btl-turn-bar');
  if(turnBar){
    turnBar.style.background=isMyTurn?'rgba(176,58,46,0.95)':'rgba(31,97,141,0.95)';
    turnBar.textContent=isMyTurn?'🔴 レッドのターン':'🔵 ブルーのターン'+(btl.cpuMode&&!isMyTurn?' (CPU)':'');
  }
  ['my','enemy'].forEach(function(side){
    const panel=document.getElementById('btl-panel-'+side);
    const lbl=document.getElementById('btl-turn-lbl-'+side);
    const active=(side==='my')===isMyTurn;
    if(panel)panel.style.opacity=active?'1':'0.4';
    if(lbl){
      lbl.style.background=active?(side==='my'?'rgba(176,58,46,0.6)':'rgba(31,97,141,0.6)'):'rgba(255,255,255,0.05)';
      lbl.style.color=active?'white':'rgba(255,255,255,0.3)';
      lbl.textContent=active?(side==='my'?'🔴 こうげきして！':'🔵 こうげきして！'):'⏳ まってね…';
    }
    const wrap=document.getElementById('btl-img-'+side);
    if(wrap){const img=wrap.querySelector('img');if(img)img.style.filter=(side==='enemy'?'scaleX(-1) ':'')+(active?'drop-shadow(0 0 14px '+(side==='my'?'#ff6b6b':'#6bb3ff')+') brightness(1.1)':'drop-shadow(0 4px 10px rgba(0,0,0,0.3))');}
  });
}

// ===== スコア =====
function updateScore(){
  const s=document.getElementById('btl-score');
  if(s){s.textContent='🏆'+btl.wins+' 💀'+btl.losses;s.style.animation='score-bump 0.3s ease';setTimeout(function(){s.style.animation='';},300);}
}

// ===== 勝敗 =====
function showWinLose(text,color){
  stopBattleBgm();
  addBattleLog(text);
  const isWin=text.includes('かち')||text.includes('かった');
  if(isWin)playFanfare();

  // 全画面勝敗演出
  const ov=el('div','');
  const grad=isWin?'linear-gradient(135deg,#1e8449,#27ae60)':'linear-gradient(135deg,#6c3483,#8e44ad)';
  ov.style.cssText='position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:'+grad+';opacity:0;transition:opacity 0.4s;';
  const emoji=el('div','');emoji.style.cssText='font-size:72px;animation:announce-pop 0.5s 0.1s ease both;';emoji.textContent=isWin?'🏆':'💀';
  const msg=el('div','');msg.style.cssText='font-size:36px;font-weight:900;color:white;text-shadow:0 3px 16px rgba(0,0,0,0.5);margin-top:12px;text-align:center;animation:announce-pop 0.5s 0.25s ease both;';msg.textContent=text;
  const sub=el('div','');sub.style.cssText='font-size:14px;color:rgba(255,255,255,0.75);margin-top:14px;animation:sub-fadein 0.4s 0.6s ease both;';sub.textContent='タップでとじる';
  ov.appendChild(emoji);ov.appendChild(msg);ov.appendChild(sub);

  // 紙吹雪
  if(isWin){
    for(let i=0;i<40;i++){
      const c=el('div','');const cols=['#f1c40f','#e74c3c','#2ecc71','#3498db','#9b59b6','#e67e22','#1abc9c','#e91e63'];
      c.style.cssText='position:fixed;pointer-events:none;z-index:9001;left:'+Math.random()*100+'%;top:-20px;width:'+(7+Math.random()*9)+'px;height:'+(7+Math.random()*9)+'px;background:'+cols[Math.floor(Math.random()*cols.length)]+';border-radius:'+(Math.random()>0.4?'50%':'3px')+';animation:confetti '+(2+Math.random()*2.5)+'s '+(Math.random()*0.8)+'s linear forwards;';
      document.body.appendChild(c);setTimeout(function(){c.remove();},4000);
    }
  }

  document.body.appendChild(ov);
  requestAnimationFrame(function(){ov.style.opacity='1';});
  ov.addEventListener('click',function(){ov.style.opacity='0';setTimeout(function(){ov.remove();},400);});
  setTimeout(function(){ov.style.opacity='0';setTimeout(function(){ov.remove();},400);},4000);
}

// ===== こうたい選択 =====
function showChangeSelect(side){
  const team=side==='my'?btl.myTeam:btl.enemyTeam;
  const curIdx=side==='my'?btl.myIdx:btl.enemyIdx;
  const fainted=side==='my'?btl.fainted.my:btl.fainted.enemy;
  const _rw=document.getElementById('btl-root')||document.body;
  const isRed=side==='my';

  const ov=el('div','');
  ov.style.cssText='position:absolute;inset:0;background:rgba(0,0,0,0.88);z-index:3000;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;opacity:0;transition:opacity 0.25s;';
  const panel=el('div','');
  panel.style.cssText='width:100%;background:linear-gradient(160deg,#1a1a2e,#16213e);border-radius:22px 22px 0 0;padding:18px 16px 14px;color:white;';

  const title=el('div','');title.style.cssText='font-size:17px;font-weight:900;text-align:center;margin-bottom:16px;';title.textContent='🔄 つぎのポケモンをえらんでね！';panel.appendChild(title);

  team.forEach(function(p,i){
    if(i===curIdx)return;
    const isF=fainted.includes(i);
    const btn=el('button','btl-btn');
    btn.style.cssText='display:flex;align-items:center;gap:14px;width:100%;margin-bottom:10px;padding:12px 14px;background:'+(isF?'rgba(80,80,80,0.35)':'rgba(255,255,255,0.1)')+';border:2px solid rgba(255,255,255,'+(isF?'0.08':'0.28')+');border-radius:14px;color:white;opacity:'+(isF?'0.5':'1')+';';
    const img=el('img','');img.src=battleImgUrl(p);img.style.cssText='width:56px;height:56px;object-fit:contain;filter:'+(isF?'grayscale(1)':'none')+';';
    const info=el('div','');
    const nm=el('div','');nm.style.cssText='font-size:16px;font-weight:900;';nm.textContent=p.name+(p.shinyImg?' ✨':'');
    const hpLine=el('div','');hpLine.style.cssText='font-size:11px;color:rgba(255,255,255,0.6);margin-top:3px;';
    hpLine.textContent=isF?'💀 たおれた':'HP '+btl.hp[side][i]+' / '+btl.maxHp;
    info.appendChild(nm);info.appendChild(hpLine);btn.appendChild(img);btn.appendChild(info);
    if(!isF){
      btn.addEventListener('click',function(){
        ov.style.opacity='0';
        setTimeout(function(){
          ov.remove();
          if(side==='my')btl.myIdx=i;else btl.enemyIdx=i;
          const newPoke=team[i];rollShiny(newPoke);
          phaseFlash(isRed?'linear-gradient(135deg,#922b21,#e74c3c)':'linear-gradient(135deg,#1a5276,#3498db)',
            (isRed?'🔴 ':'🔵 ')+newPoke.name+'、ゆけっ！','',function(){
            showBattleMain(false);
            setTimeout(function(){
              const imgEl=document.querySelector('#btl-img-'+side+' img');
              if(imgEl)playBallEmerge(imgEl,side,newPoke,function(){
                addBattleLog(newPoke.name+'、ゆけっ！');
                btl.turn=side==='my'?'my':'enemy';
                turnFlash(btl.turn,function(){
                  updateTurnDisplay();
                  if(btl.cpuMode&&btl.turn==='enemy')setTimeout(doCpuTurn,700);
                });
              });
            },100);
          },1000);
        },280);
      });
    }
    panel.appendChild(btn);
  });

  const cancelBtn=el('button','btl-btn');cancelBtn.textContent='← キャンセル';
  cancelBtn.style.cssText='display:block;width:100%;padding:12px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);color:white;border-radius:12px;font-size:14px;margin-top:4px;';
  cancelBtn.addEventListener('click',function(){ov.style.opacity='0';setTimeout(function(){ov.remove();},280);});
  panel.appendChild(cancelBtn);
  ov.appendChild(panel);_rw.appendChild(ov);
  requestAnimationFrame(function(){ov.style.opacity='1';});
}
